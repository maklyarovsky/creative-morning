<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Творческое утро</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F5F2;
    --card: #ffffff;
    --border: #E8E5E0;
    --text: #1a1a1a;
    --text-muted: #888880;
    --accent: #1a1a1a;
    --badge-ad: #2d2d2d;
    --badge-clip: #4a3728;
    --badge-anim: #2a3d2a;
    --badge-reels: #1a2a3d;
    --badge-ai: #3d1a3d;
  }

  body {
    font-family: 'Golos Text', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  header {
    padding: 48px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header .date {
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 400;
  }

  .api-key-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .api-key-section label {
    font-size: 0.85rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .api-key-section input {
    flex: 1;
    min-width: 200px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-family: 'Golos Text', sans-serif;
    font-size: 0.85rem;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  .api-key-section input:focus { border-color: #aaa; }

  .api-key-saved {
    font-size: 0.8rem;
    color: #5a8a5a;
    display: none;
  }

  section { margin-bottom: 40px; }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.35rem;
    font-weight: 600;
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 40px 0;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    transition: border-color 0.2s;
  }

  .quote-card {
    position: relative;
    padding: 32px 32px 28px;
  }

  .quote-mark {
    font-family: 'Playfair Display', serif;
    font-size: 5rem;
    line-height: 1;
    color: var(--border);
    position: absolute;
    top: 12px;
    left: 24px;
    user-select: none;
  }

  .quote-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.15rem;
    line-height: 1.7;
    padding-top: 24px;
    color: var(--text);
  }

  .quote-author {
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .grid-5 {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .grid-4 {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #fff;
    margin-bottom: 10px;
  }

  .badge-реклама { background: var(--badge-ad); }
  .badge-клип { background: var(--badge-clip); }
  .badge-анимация { background: var(--badge-anim); }
  .badge-рилс { background: var(--badge-reels); }
  .badge-ai-видео, .badge-ai { background: var(--badge-ai); }

  .insight-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.2s;
  }

  .insight-card:hover { border-color: #ccc; }

  .insight-title {
    font-weight: 600;
    font-size: 0.95rem;
    line-height: 1.4;
  }

  .insight-brand {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .insight-scenario {
    font-size: 0.85rem;
    color: #555;
    line-height: 1.55;
  }

  .insight-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 8px;
  }

  .insight-link {
    font-size: 0.82rem;
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1px;
    transition: border-color 0.2s;
  }

  .insight-link:hover { border-color: var(--text); }

  .like-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 2px 4px;
    border-radius: 4px;
    transition: transform 0.15s;
    line-height: 1;
  }

  .like-btn:hover { transform: scale(1.2); }
  .like-btn.liked { color: #c0392b; }

  .person-card { padding: 28px; }

  .person-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }

  .person-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--text);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 600;
    flex-shrink: 0;
  }

  .person-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 600;
    line-height: 1.2;
  }

  .person-profession {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .person-bio {
    font-size: 0.9rem;
    line-height: 1.65;
    color: #333;
    margin-bottom: 16px;
  }

  .person-style {
    background: var(--bg);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 0.85rem;
    color: #444;
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .person-style-label {
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .person-works { list-style: none; }

  .person-works li {
    padding: 10px 0;
    border-top: 1px solid var(--border);
    font-size: 0.88rem;
    display: flex;
    gap: 12px;
  }

  .person-works li:first-child { border-top: none; }

  .work-year {
    color: var(--text-muted);
    font-size: 0.8rem;
    white-space: nowrap;
    padding-top: 1px;
  }

  .work-info { flex: 1; }
  .work-title { font-weight: 600; }
  .work-desc { color: #555; font-size: 0.82rem; margin-top: 2px; }

  .trend-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .trend-name {
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 8px;
  }

  .trend-desc {
    font-size: 0.85rem;
    color: #555;
    line-height: 1.55;
    margin-bottom: 10px;
  }

  .trend-example {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-style: italic;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }

  .exercise-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  .exercise-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.3;
  }

  .time-badge {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.8rem;
    color: var(--text-muted);
    white-space: nowrap;
    font-weight: 500;
  }

  .exercise-desc {
    font-size: 0.9rem;
    line-height: 1.65;
    color: #333;
    margin-bottom: 16px;
    white-space: pre-line;
  }

  .exercise-goal {
    background: var(--bg);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 0.85rem;
  }

  .exercise-goal-label {
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .chat-container {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .chat-messages {
    padding: 20px;
    min-height: 200px;
    max-height: 480px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .chat-empty {
    color: var(--text-muted);
    font-size: 0.88rem;
    text-align: center;
    padding: 24px 0;
    font-style: italic;
  }

  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.88rem;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .msg-user {
    background: var(--text);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .msg-ai {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }

  .msg-thinking {
    color: var(--text-muted);
    font-style: italic;
    font-size: 0.82rem;
    align-self: flex-start;
    padding: 8px 0;
  }

  .chat-input-area {
    border-top: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--bg);
  }

  .chat-textarea {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'Golos Text', sans-serif;
    font-size: 0.88rem;
    resize: none;
    min-height: 40px;
    max-height: 120px;
    background: var(--card);
    color: var(--text);
    outline: none;
    overflow-y: auto;
    transition: border-color 0.2s;
    line-height: 1.5;
  }

  .chat-textarea:focus { border-color: #aaa; }

  .chat-send-btn {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: var(--text);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s;
  }

  .chat-send-btn:hover { opacity: 0.8; }
  .chat-send-btn:disabled { opacity: 0.4; cursor: default; }

  .tracker-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }

  .tracker-check {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: var(--text);
    flex-shrink: 0;
  }

  .tracker-label {
    font-size: 0.95rem;
    cursor: pointer;
    user-select: none;
  }

  .calendar-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }

  .cal-day-label {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 4px 0;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .cal-day {
    aspect-ratio: 1;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82rem;
    color: var(--text-muted);
    background: transparent;
    cursor: default;
    transition: background 0.15s;
  }

  .cal-day.done {
    background: var(--text);
    color: #fff;
  }

  .cal-day.today {
    outline: 2px solid var(--text);
    outline-offset: -2px;
    color: var(--text);
    font-weight: 600;
  }

  .cal-day.done.today { color: #fff; }
  .cal-day.empty { background: transparent; }

  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .tab-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    font-family: 'Golos Text', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.15s;
    font-weight: 500;
  }

  .tab-btn.active, .tab-btn:hover {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }

  .likes-placeholder {
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.88rem;
  }

  .btn-primary {
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-family: 'Golos Text', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: opacity 0.2s;
  }

  .btn-primary:hover { opacity: 0.82; }
  .btn-primary:disabled { opacity: 0.45; cursor: default; }

  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    font-family: 'Golos Text', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: border-color 0.2s, opacity 0.2s;
  }

  .btn-secondary:hover { border-color: #aaa; }
  .btn-secondary:disabled { opacity: 0.45; cursor: default; }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    color: #c0392b;
    font-size: 0.85rem;
    padding: 12px 16px;
    background: #fff5f5;
    border: 1px solid #f5c6c6;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .error-msg a {
    color: #c0392b;
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>Творческое утро</h1>
    <span class="date" id="currentDate"></span>
  </header>

  <div class="api-key-section">
    <label for="apiKeyInput">Anthropic API Key</label>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off">
    <span class="api-key-saved" id="apiKeySaved">Сохранён ✓</span>
  </div>

  <section id="quoteSection">
    <div id="quoteContent"><div style="display:flex;align-items:center;gap:10px;color:var(--text-muted);font-size:.88rem;"><span class="spinner"></span> Загружаю цитату дня…</div></div>
  </section>

  <hr>

  <section>
    <div class="section-header">
      <h2 class="section-title">Насмотренность</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-secondary" id="randomBtn" onclick="loadInsights(true)">↺ Рандомайзер</button>
        <button class="btn-primary" id="insightsBtn" onclick="loadInsights(false)">Загрузить подборку</button>
      </div>
    </div>
    <div id="insightsContent"></div>
  </section>

  <hr>

  <section>
    <div class="section-header">
      <h2 class="section-title">Личность дня</h2>
      <button class="btn-primary" id="personBtn" onclick="loadPerson()">Загрузить</button>
    </div>
    <div id="personContent"></div>
  </section>

  <hr>

  <section>
    <div class="section-header">
      <h2 class="section-title">Тренды в графическом дизайне</h2>
      <button class="btn-primary" id="trendsBtn" onclick="loadTrends()">Загрузить</button>
    </div>
    <div id="trendsContent"></div>
  </section>

  <hr>

  <section>
    <div class="section-header">
      <h2 class="section-title">Упражнение дня</h2>
      <button class="btn-primary" id="exerciseBtn" onclick="loadExercise()">Загрузить</button>
    </div>
    <div id="exerciseContent"></div>
  </section>

  <hr>

  <section>
    <div class="section-header">
      <h2 class="section-title">Генерация концепта</h2>
    </div>
    <div class="chat-container">
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty">Опиши идею — я помогу её докрутить до концепта для видео, клипа или фэшн-съёмки</div>
      </div>
      <div class="chat-input-area">
        <textarea class="chat-textarea" id="chatInput" placeholder="Опиши концепт или задай вопрос…" rows="1"></textarea>
        <button class="chat-send-btn" id="chatSendBtn" onclick="sendChat()" title="Отправить">↑</button>
      </div>
    </div>
  </section>

  <hr>

  <section>
    <div class="section-header">
      <h2 class="section-title">Трекер практики</h2>
    </div>
    <div class="card" style="padding:28px;">
      <div class="tracker-top">
        <input type="checkbox" class="tracker-check" id="todayCheck" onchange="toggleToday()">
        <label for="todayCheck" class="tracker-label">Сегодняшняя практика завершена</label>
      </div>
      <div class="calendar-header">
        <div class="cal-day-label">Пн</div>
        <div class="cal-day-label">Вт</div>
        <div class="cal-day-label">Ср</div>
        <div class="cal-day-label">Чт</div>
        <div class="cal-day-label">Пт</div>
        <div class="cal-day-label">Сб</div>
        <div class="cal-day-label">Вс</div>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </section>

  <hr>

  <section>
    <div class="section-header">
      <h2 class="section-title">Библиотека лайков</h2>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="filterLikes('all', this)">Все</button>
      <button class="tab-btn" onclick="filterLikes('реклама', this)">Реклама</button>
      <button class="tab-btn" onclick="filterLikes('клип', this)">Клипы</button>
      <button class="tab-btn" onclick="filterLikes('анимация', this)">Анимация</button>
      <button class="tab-btn" onclick="filterLikes('рилс', this)">Рилсы</button>
      <button class="tab-btn" onclick="filterLikes('ai-видео', this)">AI</button>
    </div>
    <div id="likesContent"></div>
  </section>

</div>

<script>
const today = new Date();
const dateKey = today.toISOString().slice(0, 10);

function getLS(key, def = null) {
  try { const v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : def; }
  catch { return def; }
}

function setLS(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

function getApiKey() {
  return document.getElementById('apiKeyInput').value.trim() || getLS('anthropic_api_key', '');
}

function formatDate(d) {
  const days = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
}

function parseJSON(raw) {
  let str = raw.replace(/```json\s*/gi, '').replace(/```\s*/g, '').trim();
  const arrMatch = str.match(/\[[\s\S]*\]/);
  if (arrMatch) { try { return JSON.parse(arrMatch[0]); } catch {} }
  const objMatch = str.match(/\{[\s\S]*\}/);
  if (objMatch) { try { return JSON.parse(objMatch[0]); } catch {} }
  try { return JSON.parse(str); } catch {}
  return null;
}

function spinner() { return '<span class="spinner"></span>'; }

function errHtml(msg, retryFn) {
  return `<div class="error-msg">⚠ ${msg} <a onclick="${retryFn}">Попробовать снова</a></div>`;
}

function setLoading(btn, loading) {
  if (!btn) return;
  btn.disabled = loading;
  if (loading) { btn._orig = btn.innerHTML; btn.innerHTML = spinner() + ' Загружаю…'; }
  else { btn.innerHTML = btn._orig || 'Загрузить'; }
}

const SYSTEM = `Ты персональный творческий куратор видеографа и арт-директора. Контент живой и конкретный, не энциклопедический. Ориентация на авторское визуальное искусство. Всегда отвечай на русском языке. Возвращай JSON без markdown-обёртки и без лишних комментариев.`;

const HEADERS = {
  'x-api-key': '',
  'anthropic-version': '2023-06-01',
  'anthropic-dangerous-direct-browser-access': 'true',
  'content-type': 'application/json'
};

async function callClaude({ prompt, tools, maxTokens = 1024 }) {
  const key = getApiKey();
  if (!key) throw new Error('Введите API ключ Anthropic');

  const body = {
    model: 'claude-sonnet-4-5',
    max_tokens: maxTokens,
    system: SYSTEM,
    messages: [{ role: 'user', content: prompt }]
  };
  if (tools) body.tools = tools;

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { ...HEADERS, 'x-api-key': key },
    body: JSON.stringify(body)
  });

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${resp.status}`);
  }

  const data = await resp.json();
  const textBlock = data.content?.find(b => b.type === 'text');
  return textBlock?.text || '';
}

  const resp = await fetch('https://api.anthropic.com/v1/messages', {

  });

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${resp.status}`);
  }

  const data = await resp.json();

  return textBlock?.text || '';
}

// CHAT
let chatHistory = [];
let chatSending = false;

function renderChatMessages() {
  const el = document.getElementById('chatMessages');
  if (chatHistory.length === 0) {
    el.innerHTML = '<div class="chat-empty">Опиши идею — я помогу её докрутить до концепта для видео, клипа или фэшн-съёмки</div>';
    return;
  }
  el.innerHTML = chatHistory.map(m => {
    const cls = m.role === 'user' ? 'msg msg-user' : 'msg msg-ai';
    return `<div class="${cls}">${escHtml(m.content)}</div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function sendChat() {
  if (chatSending) return;
  const ta = document.getElementById('chatInput');
  const text = ta.value.trim();
  if (!text) return;

  chatHistory.push({ role: 'user', content: text });
  ta.value = '';
  ta.style.height = 'auto';
  renderChatMessages();

  const el = document.getElementById('chatMessages');
  const thinking = document.createElement('div');
  thinking.className = 'msg-thinking';
  thinking.textContent = 'думаю…';
  el.appendChild(thinking);
  el.scrollTop = el.scrollHeight;

  chatSending = true;
  document.getElementById('chatSendBtn').disabled = true;

  try {
    const reply = await callClaudeChat(chatHistory, 1500);
    chatHistory.push({ role: 'assistant', content: reply });
  } catch (e) {
    chatHistory.push({ role: 'assistant', content: `Ошибка: ${e.message}` });
  } finally {
    chatSending = false;
    document.getElementById('chatSendBtn').disabled = false;
    renderChatMessages();
  }
}

document.getElementById('chatInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});

document.getElementById('chatInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

function toggleToday() {
  const checked = document.getElementById('todayCheck').checked;
  const doneDays = getLS('doneDays', {});
  if (checked) { doneDays[dateKey] = true; } else { delete doneDays[dateKey]; }
  setLS('doneDays', doneDays);
  renderCalendar();
}

function renderCalendar() {
  const doneDays = getLS('doneDays', {});
  const y = today.getFullYear(), m = today.getMonth();
  const firstDay = new Date(y, m, 1);
  const lastDay = new Date(y, m + 1, 0);
  let startDow = firstDay.getDay();
  startDow = startDow === 0 ? 6 : startDow - 1;

  let html = '';
  for (let i = 0; i < startDow; i++) html += '<div class="cal-day empty"></div>';
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const dk = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const classes = ['cal-day', doneDays[dk] ? 'done' : '', dk === dateKey ? 'today' : ''].filter(Boolean).join(' ');
    html += `<div class="${classes}">${d}</div>`;
  }
  document.getElementById('calendarGrid').innerHTML = html;
  document.getElementById('todayCheck').checked = !!doneDays[dateKey];
}

    return;

  el.innerHTML = `<div class="grid-5">

      const cat = (it.category || '').toLowerCase();
      return `<div class="insight-card">

function removeLike(encodedKey) {
  const key = decodeURIComponent(encodedKey);

  setLS('likes', likes);
  renderLikes(currentFilter);
}
