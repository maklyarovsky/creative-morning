<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Творческое утро</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0D0A07;
    --bg2: #130E09;
    --card: #1A1410;
    --card2: #211A12;
    --border: #3A2E1E;
    --border-gold: #6B4F1E;
    --text: #F0E8D8;
    --text-muted: #8A7660;
    --rust: #C4622D;
    --gold: #D4A843;
    --gold2: #A87C2A;
    --cream: #F0E8D8;
  }

  body {
    font-family: 'Golos Text', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Ornamental top border */
  body::before {
    content: '';
    display: block;
    height: 4px;
    background: repeating-linear-gradient(
      90deg,
      var(--rust) 0px, var(--rust) 8px,
      var(--gold) 8px, var(--gold) 16px,
      var(--rust) 16px, var(--rust) 24px,
      var(--bg) 24px, var(--bg) 28px
    );
  }

  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ORNAMENT */
  .orn {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 0;
  }
  .orn::before, .orn::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
  }
  .orn-sym {
    color: var(--gold2);
    font-size: 0.7rem;
    letter-spacing: 6px;
  }

  /* HEADER */
  header {
    padding: 48px 0 32px;
    margin-bottom: 40px;
    text-align: center;
    position: relative;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--cream);
    line-height: 1;
    margin-bottom: 10px;
  }

  header h1 span {
    color: var(--rust);
  }

  header .date {
    font-size: 0.78rem;
    color: var(--text-muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .header-ornament {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 16px 0 4px;
  }

  .header-ornament span {
    width: 6px;
    height: 6px;
    background: var(--rust);
    transform: rotate(45deg);
    display: inline-block;
  }

  .header-ornament span:nth-child(2) {
    background: var(--gold);
    width: 8px;
    height: 8px;
  }

  /* API KEY */
  .api-key-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 16px 20px;
    margin-bottom: 36px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    position: relative;
  }

  .api-key-section::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--rust);
  }

  .api-key-section label {
    font-size: 0.72rem;
    color: var(--text-muted);
    white-space: nowrap;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .api-key-section input {
    flex: 1;
    min-width: 200px;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 8px 12px;
    font-family: 'Golos Text', sans-serif;
    font-size: 0.85rem;
    background: var(--bg2);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  .api-key-section input:focus { border-color: var(--gold2); }

  .api-key-saved {
    font-size: 0.78rem;
    color: var(--gold);
    display: none;
    letter-spacing: 0.06em;
  }

  /* SECTION */
  section { margin-bottom: 48px; }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--cream);
  }

  .section-title em {
    color: var(--rust);
    font-style: normal;
  }

  hr {
    border: none;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-gold) 20%, var(--border-gold) 80%, transparent);
    margin: 48px 0;
    position: relative;
  }

  hr::after {
    content: '◆';
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: var(--gold2);
    font-size: 0.6rem;
    background: var(--bg);
    padding: 0 8px;
  }

  /* CARDS */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* Corner ornaments */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 20px; height: 20px;
    border-top: 2px solid var(--rust);
    border-left: 2px solid var(--rust);
  }

  .card::after {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 20px; height: 20px;
    border-bottom: 2px solid var(--rust);
    border-right: 2px solid var(--rust);
  }

  /* QUOTE */
  .quote-card {
    padding: 36px 36px 32px;
    text-align: center;
    background: var(--card2);
    border-color: var(--border-gold);
  }

  .quote-mark {
    font-family: 'Playfair Display', serif;
    font-size: 4rem;
    line-height: 0.5;
    color: var(--rust);
    display: block;
    margin-bottom: 20px;
    opacity: 0.8;
  }

  .quote-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.2rem;
    line-height: 1.75;
    color: var(--cream);
    max-width: 640px;
    margin: 0 auto 20px;
  }

  .quote-author {
    font-size: 0.72rem;
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* GRID */
  .grid-5 {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }

  .grid-4 {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  /* BADGE */
  .badge {
    display: inline-block;
    padding: 2px 9px;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
    border: 1px solid;
  }

  .badge-реклама { color: #E8A87C; border-color: #8B4513; background: rgba(139,69,19,0.2); }
  .badge-клип    { color: #B8A0D8; border-color: #5A3878; background: rgba(90,56,120,0.2); }
  .badge-анимация { color: #7EC8A0; border-color: #1E6B40; background: rgba(30,107,64,0.2); }
  .badge-рилс    { color: #7AB8D8; border-color: #1E4A6B; background: rgba(30,74,107,0.2); }
  .badge-ai-видео, .badge-ai { color: var(--gold); border-color: var(--gold2); background: rgba(168,124,42,0.15); }

  /* INSIGHT CARD */
  .insight-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }

  .insight-card:hover {
    border-color: var(--border-gold);
    background: var(--card2);
  }

  .insight-title {
    font-weight: 700;
    font-size: 0.92rem;
    line-height: 1.3;
    color: var(--cream);
    letter-spacing: 0.02em;
  }

  .insight-brand {
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .insight-scenario {
    font-size: 0.83rem;
    color: #9A8870;
    line-height: 1.6;
  }

  .insight-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .insight-link {
    font-size: 0.78rem;
    color: var(--gold);
    text-decoration: none;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .insight-link:hover { color: var(--rust); }

  .like-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    padding: 2px 4px;
    transition: transform 0.15s;
    line-height: 1;
    color: var(--text-muted);
  }

  .like-btn:hover { transform: scale(1.25); color: var(--rust); }
  .like-btn.liked { color: var(--rust); }

  /* PERSON */
  .person-card { padding: 28px; }

  .person-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .person-avatar {
    width: 60px;
    height: 60px;
    border: 2px solid var(--rust);
    color: var(--rust);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    font-weight: 700;
    flex-shrink: 0;
    background: var(--card2);
    position: relative;
  }

  .person-avatar::before {
    content: '';
    position: absolute;
    inset: 3px;
    border: 1px solid var(--border-gold);
  }

  .person-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.2;
    color: var(--cream);
    letter-spacing: 0.02em;
  }

  .person-profession {
    font-size: 0.75rem;
    color: var(--gold);
    margin-top: 4px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .person-bio {
    font-size: 0.88rem;
    line-height: 1.7;
    color: #9A8870;
    margin-bottom: 16px;
  }

  .person-style {
    background: var(--bg2);
    border-left: 3px solid var(--rust);
    padding: 14px 16px;
    font-size: 0.85rem;
    color: #8A7660;
    line-height: 1.65;
    margin-bottom: 20px;
  }

  .person-style-label {
    font-weight: 700;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--rust);
    margin-bottom: 6px;
  }

  .person-works { list-style: none; }

  .person-works li {
    padding: 12px 0;
    border-top: 1px solid var(--border);
    font-size: 0.86rem;
    display: flex;
    gap: 14px;
  }

  .work-year {
    color: var(--gold2);
    font-size: 0.75rem;
    white-space: nowrap;
    padding-top: 2px;
    font-weight: 700;
    letter-spacing: 0.06em;
    min-width: 36px;
  }

  .work-info { flex: 1; }
  .work-title { font-weight: 700; color: var(--cream); font-size: 0.88rem; }
  .work-desc { color: #7A6B58; font-size: 0.8rem; margin-top: 3px; line-height: 1.5; }

  /* TREND CARD */
  .trend-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 20px;
    transition: border-color 0.2s;
    position: relative;
    overflow: hidden;
  }

  .trend-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--rust), var(--gold));
  }

  .trend-card:hover { border-color: var(--border-gold); }

  .trend-num {
    font-size: 0.65rem;
    color: var(--rust);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .trend-name {
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 10px;
    color: var(--cream);
    letter-spacing: 0.02em;
    line-height: 1.3;
  }

  .trend-desc {
    font-size: 0.82rem;
    color: #8A7660;
    line-height: 1.6;
    margin-bottom: 12px;
  }

  .trend-example-label {
    font-size: 0.65rem;
    color: var(--gold2);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .trend-example {
    font-size: 0.8rem;
    color: var(--gold);
    line-height: 1.5;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }

  /* EXERCISE */
  .exercise-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .exercise-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.3;
    color: var(--cream);
    letter-spacing: 0.02em;
  }

  .time-badge {
    background: transparent;
    border: 1px solid var(--rust);
    padding: 4px 12px;
    font-size: 0.72rem;
    color: var(--rust);
    white-space: nowrap;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .exercise-desc {
    font-size: 0.88rem;
    line-height: 1.75;
    color: #9A8870;
    margin-bottom: 18px;
    white-space: pre-line;
  }

  .exercise-goal {
    background: var(--bg2);
    border-left: 3px solid var(--gold);
    padding: 12px 16px;
    font-size: 0.84rem;
    color: #8A7660;
    line-height: 1.6;
  }

  .exercise-goal-label {
    font-weight: 700;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--gold);
    margin-bottom: 4px;
  }

  /* CHAT */
  .chat-container {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .chat-header-bar {
    background: var(--card2);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .chat-header-bar span {
    font-size: 0.68rem;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .chat-status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--rust);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .chat-messages {
    padding: 20px;
    min-height: 200px;
    max-height: 480px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
    background: var(--bg2);
  }

  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-track { background: var(--bg); }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border-gold); }

  .chat-empty {
    color: var(--text-muted);
    font-size: 0.85rem;
    text-align: center;
    padding: 32px 0;
    font-style: italic;
    letter-spacing: 0.02em;
  }

  .msg {
    max-width: 80%;
    padding: 10px 14px;
    font-size: 0.86rem;
    line-height: 1.65;
    white-space: pre-wrap;
  }

  .msg-user {
    background: var(--rust);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 2px;
  }

  .msg-ai {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    align-self: flex-start;
    border-left: 2px solid var(--gold2);
  }

  .msg-thinking {
    color: var(--text-muted);
    font-style: italic;
    font-size: 0.8rem;
    align-self: flex-start;
    padding: 8px 0;
    letter-spacing: 0.06em;
  }

  .chat-input-area {
    border-top: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--card);
  }

  .chat-textarea {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 10px 12px;
    font-family: 'Golos Text', sans-serif;
    font-size: 0.86rem;
    resize: none;
    min-height: 40px;
    max-height: 120px;
    background: var(--bg2);
    color: var(--text);
    outline: none;
    overflow-y: auto;
    transition: border-color 0.2s;
    line-height: 1.5;
  }

  .chat-textarea:focus { border-color: var(--gold2); }
  .chat-textarea::placeholder { color: var(--text-muted); }

  .chat-send-btn {
    width: 40px;
    height: 40px;
    background: var(--rust);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s;
    letter-spacing: 0;
  }

  .chat-send-btn:hover { opacity: 0.8; }
  .chat-send-btn:disabled { opacity: 0.35; cursor: default; }

  /* TRACKER */
  .tracker-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .tracker-check {
    width: 18px; height: 18px;
    cursor: pointer;
    accent-color: var(--rust);
    flex-shrink: 0;
  }

  .tracker-label {
    font-size: 0.88rem;
    cursor: pointer;
    user-select: none;
    color: var(--cream);
    letter-spacing: 0.04em;
    font-weight: 500;
  }

  .calendar-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 3px;
  }

  .cal-day-label {
    text-align: center;
    font-size: 0.65rem;
    color: var(--text-muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 6px 0;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }

  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    color: var(--text-muted);
    background: var(--bg2);
    cursor: default;
    transition: background 0.15s;
    font-weight: 500;
  }

  .cal-day.done {
    background: var(--rust);
    color: #fff;
    font-weight: 700;
  }

  .cal-day.today {
    outline: 2px solid var(--gold);
    outline-offset: -2px;
    color: var(--gold);
    font-weight: 700;
  }

  .cal-day.done.today { color: #fff; }
  .cal-day.empty { background: transparent; }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .tab-btn {
    padding: 5px 14px;
    border: 1px solid var(--border);
    background: transparent;
    font-family: 'Golos Text', sans-serif;
    font-size: 0.72rem;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.15s;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 0;
  }

  .tab-btn.active, .tab-btn:hover {
    background: var(--rust);
    color: #fff;
    border-color: var(--rust);
  }

  .likes-placeholder {
    border: 1px dashed var(--border-gold);
    padding: 48px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    letter-spacing: 0.04em;
  }

  /* BUTTONS */
  .btn-primary {
    background: var(--rust);
    color: #fff;
    border: none;
    padding: 10px 22px;
    font-family: 'Golos Text', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: opacity 0.2s;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .btn-primary:hover { opacity: 0.82; }
  .btn-primary:disabled { opacity: 0.4; cursor: default; }

  .btn-secondary {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 10px 18px;
    font-family: 'Golos Text', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;

const dateKey = today.toISOString().slice(0,10);

function getLS(k,d=null){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch{return d;}}
function setLS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

function getApiKey(){
  return document.getElementById('apiKeyInput').value.trim() || getLS('anthropic_api_key','');
}

function formatDate(d){
  const days=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
}

function parseJSON(raw){
  if(!raw) return null;
  let str = raw.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
  // Try array
  const arrM = str.match(/\[[\s\S]*\]/);
  if(arrM){try{return JSON.parse(arrM[0]);}catch{}}
  // Try object
  const objM = str.match(/\{[\s\S]*\}/);
  if(objM){try{return JSON.parse(objM[0]);}catch{}}
  try{return JSON.parse(str);}catch{}
  return null;
}

function sp(){return '<span class="spinner"></span>';}
function loading(msg='Загружаю…'){return `<div class="loading-state">${sp()} ${msg}</div>`;}
function errHtml(msg,fn){return `<div class="error-msg">⚠ ${msg} <a onclick="${fn}">Попробовать снова</a></div>`;}

function setBtnLoad(id,on){
  const b=document.getElementById(id);if(!b)return;
  b.disabled=on;
  if(on){b._o=b.innerHTML;b.innerHTML=sp()+' Загружаю…';}
  else{b.innerHTML=b._o||'Загрузить';}
}

const SYS=`Ты персональный творческий куратор видеографа и арт-директора. Отвечай живо и конкретно. Ориентируйся на авторское визуальное искусство. Всегда на русском языке. Возвращай ТОЛЬКО валидный JSON без markdown-обёртки, без комментариев, без текста вне JSON.`;

const HDR=(key)=>({
  'x-api-key':key,
  'anthropic-version':'2023-06-01',
  'anthropic-dangerous-direct-browser-access':'true',
  'content-type':'application/json'
});

async function claude(prompt,maxTokens=1200){
  const key=getApiKey();
  if(!key) throw new Error('Введите API ключ Anthropic');
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:HDR(key),
    body:JSON.stringify({
      model:'claude-sonnet-4-5',
      max_tokens:maxTokens,
      system:SYS,
      messages:[{role:'user',content:prompt}]
    })
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${r.status}`);}
  const d=await r.json();
  return d.content?.find(b=>b.type==='text')?.text||'';
}

async function claudeChat(messages,maxTokens=1500){
  const key=getApiKey();
  if(!key) throw new Error('Введите API ключ Anthropic');
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:HDR(key),
    body:JSON.stringify({
      model:'claude-sonnet-4-5',
      max_tokens:maxTokens,
      system:`Ты опытный арт-директор и творческий партнёр. Помогаешь докручивать концепты для видеосъёмок, фэшн-съёмок, музыкальных клипов. Мыслишь образами, референсами, цветом, светом, движением. Конкретный, вдохновляющий, без воды. Всегда на русском языке.`,
      messages
    })
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${r.status}`);}
  const d=await r.json();
  return d.content?.find(b=>b.type==='text')?.text||'';
}

function renderInsights(items){

    </div>`;
  }).join('')}</div>`;
}

function toggleLike(i,enc){
  const it=JSON.parse(decodeURIComponent(enc));
  const likes=getLS('likes',{});
  const k=it.title;
  if(likes[k])delete likes[k];else likes[k]=it;

let chatHistory=[];
let chatSending=false;

function renderChat(){
  const el=document.getElementById('chatMessages');
  if(!chatHistory.length){
    el.innerHTML='<div class="chat-empty">Опиши идею — докрутим до концепта для видео, клипа или фэшн-съёмки</div>';
    return;
  }
  el.innerHTML=chatHistory.map(m=>{
    const cls=m.role==='user'?'msg msg-user':'msg msg-ai';
    return `<div class="${cls}">${esc(m.content)}</div>`;
  }).join('');
  el.scrollTop=el.scrollHeight;
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function sendChat(){
  if(chatSending)return;
  const ta=document.getElementById('chatInput');
  const txt=ta.value.trim();if(!txt)return;
  chatHistory.push({role:'user',content:txt});
  ta.value='';ta.style.height='auto';
  renderChat();
  const el=document.getElementById('chatMessages');
  const th=document.createElement('div');th.className='msg-thinking';th.textContent='думаю…';
  el.appendChild(th);el.scrollTop=el.scrollHeight;
  chatSending=true;document.getElementById('chatSendBtn').disabled=true;
  try{
    const r=await claudeChat(chatHistory,1500);
    chatHistory.push({role:'assistant',content:r});
  }catch(e){chatHistory.push({role:'assistant',content:`Ошибка: ${e.message}`});}
  finally{chatSending=false;document.getElementById('chatSendBtn').disabled=false;renderChat();}
}

document.getElementById('chatInput').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}
});
document.getElementById('chatInput').addEventListener('input',function(){
  this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';
});

// ─── TRACKER ───
function toggleToday(){
  const checked=document.getElementById('todayCheck').checked;
  const days=getLS('doneDays',{});
  if(checked)days[dateKey]=true;else delete days[dateKey];
  setLS('doneDays',days);renderCalendar();
}

function renderCalendar(){
  const done=getLS('doneDays',{});
  const y=today.getFullYear(),m=today.getMonth();
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  let dow=first.getDay();dow=dow===0?6:dow-1;
  let h='';
  for(let i=0;i<dow;i++)h+='<div class="cal-day empty"></div>';
  for(let d=1;d<=last.getDate();d++){
    const dk=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls=['cal-day',done[dk]?'done':'',dk===dateKey?'today':''].filter(Boolean).join(' ');
    h+=`<div class="${cls}">${d}</div>`;
  }
  document.getElementById('calendarGrid').innerHTML=h;
  document.getElementById('todayCheck').checked=!!done[dateKey];
}

// ─── LIKES ───
let currentFilter='all';

function filterLikes(f,btn){
  currentFilter=f;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderLikes(f);
}

function renderLikes(f){
  const likes=getLS('likes',{});
  let items=Object.values(likes);
  if(f!=='all')items=items.filter(it=>(it.category||'').toLowerCase()===f);
  const el=document.getElementById('likesContent');
  if(!items.length){
    el.innerHTML='<div class="likes-placeholder">Лайкните видео в разделе «Насмотренность», чтобы сохранить здесь</div>';
    return;
  }
  el.innerHTML=`<div class="grid-5">${items.map(it=>{
    const cat=(it.category||'').toLowerCase();
    const sq=`https://www.youtube.com/results?search_query=${encodeURIComponent(it.search||it.title+' '+it.brand)}`;
    return `<div class="insight-card">
      <span class="badge badge-${cat}">${it.category}</span>
      <div class="insight-title">${it.title||''}</div>
      <div class="insight-brand">${it.brand||''}${it.year?' · '+it.year:''}</div>
      <div class="insight-scenario">${it.scenario||''}</div>
      <div class="insight-footer">
        <a class="insight-link" href="${sq}" target="_blank" rel="noopener">Найти →</a>
        <button class="like-btn liked" onclick="removeLike('${encodeURIComponent(it.title)}')">♥</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function removeLike(enc){
  const k=decodeURIComponent(enc);
  const likes=getLS('likes',{});delete likes[k];setLS('likes',likes);
  renderLikes(currentFilter);
}

// ─── START ───
renderCalendar();
renderLikes('all');
loadQuote();
</script>
